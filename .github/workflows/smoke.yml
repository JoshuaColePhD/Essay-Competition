name: Smoke test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (test-only, not committed)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Load the page headlessly and exercise the main flow
        run: node tests/smoke.mjs
